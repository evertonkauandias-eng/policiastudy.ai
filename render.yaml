databases:
  - name: policiastudy-db
    databaseName: policiastudy
    plan: free

services:
  - type: web
    name: policiastudy-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: policiastudy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_API_KEY
        sync: false
      - key: AI_DAILY_MESSAGE_LIMIT
        value: 30
